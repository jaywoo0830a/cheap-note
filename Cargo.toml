[package]
name = "cheap-note"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Minimal, high-performance handwriting note-taking prototype (pen input + PDF pages + 60/120/180/240 Hz)."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# UI framework. GPUI Kit 0.6.6 pulls in GPUI + gpui-base + gpui-component; the app never
# lists GPUI itself. `component` and `assets` are on by default.
gpui-kit = "=0.6.6"

# Low-latency pen input on Windows. This crate is not published on crates.io, so it is
# pinned to the 0.2.0 git tag requested by the project.
pen-windows = { git = "https://github.com/jaywoo0830a/pen-windows", tag = "0.2.0", features = ["window-handle"] }

# PDF: Pdfium, loaded at run time from `vendor/lib/pdfium.dll`.
#
# The app resolves the handful of C entry points it calls itself — see `src/pdfium.rs` — because it
# needs the *progressive* render (`IFSDK_PAUSE`), which `pdfium-render` does not surface, and because
# the wrapper keeps its document and page handles private. `pdfium-render` is therefore a *test*
# dependency: it builds the fixture documents and cross-checks this app's rendering against a second
# implementation of the same API.

# Serialisable application state / settings. Pinned exactly, at the versions this project was
# built and measured against.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
# The note container: a zip holding the original PDF and the ink as JSON. Deflate only — the
# document inside is already compressed, so it is stored rather than deflated, and the ink is small.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# Ergonomic custom error types.
thiserror = "=2.0.21"
# Ergonomic error propagation at the application boundary.
anyhow = "=1.0.104"
# Raw pixel buffers, used to hand a rendered PDF page to GPUI's image pipeline.
image = { version = "0.25", default-features = false }

# Windows-only: display refresh-rate detection for 60/120/180/240 Hz support.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # WM_SETCURSOR, SetCursor, HTCLIENT, IDC_ARROW, LoadCursorW: hiding the system pointer over
    # the client area while the pen is in range.
    "Win32_UI_WindowsAndMessaging",
    # SetWindowSubclass / DefSubclassProc / RemoveWindowSubclass: answering WM_SETCURSOR before
    # GPUI's own window procedure does. This is the comctl32 chain pen-windows already hooks on
    # that same window, so the two procedures coexist without either knowing about the other.
    "Win32_UI_Shell",
    # LoadLibraryW / GetProcAddress: resolving Pdfium's own entry points, including the progressive
    # render the wrapper crate does not expose. See `src/pdfium.rs`.
    "Win32_System_LibraryLoader",
] }
# Named types for the raw window handle GPUI hands out (used to bind the pen capture).
raw-window-handle = "0.6"

# Keep debug builds usable: the UI stack is compiled with optimizations while the
# application's own crates stay fast to rebuild and debuggable.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# The writing loop is latency-sensitive, so the release build favours a fast binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
