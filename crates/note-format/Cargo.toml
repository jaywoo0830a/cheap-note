[package]
name = "note-format"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "The cheap-note file format: a note as a folder of SQLite and ink, and as the one file it is carried in."
license = "MIT OR Apache-2.0"
publish = false

# Nothing in this crate knows what a window, a pen or a GPU is. That is the whole point of it
# being a crate: the format is what two applications on two platforms can share, so every
# dependency here has to be one a macOS or a Linux build can link as well. A `gpui-kit`, a
# `pen-windows` or a `windows` in this list would be the format quietly becoming the app again.
[dependencies]
# Serialisable application state: a note's `meta` rows and its page list.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
# The note store: SQLite, statically compiled into whatever links this crate — `bundled` builds the
# amalgamation with `cc`, so the user never installs anything.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Chunk codec: a page's strokes as a structure-of-arrays blob, compressed and sealed with a CRC32.
zstd = "=0.14.0"
lz4_flex = "=0.14.0"
crc32fast = "=1.5.2"
# Chunks are decompressed in parallel: a page is a handful of independent 64-256 KB blobs.
rayon = "=1.12.0"
# The note container: a zip holding the note's SQLite file, the original PDF and its attachments.
# Deflate only: the SQLite file and a PDF are compressed already.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# Ergonomic custom error types.
thiserror = "=2.0.21"

# What the integration tests in `tests/` need to look at a note *from outside*: the SQLite file with
# SQLite itself, the zip with a zip reader, and a page list with a JSON parser.
#
# That is deliberate rather than convenient. A test that used this crate's own readers to check what
# this crate's own writers wrote would pass whatever the two of them agreed on; these open the files
# the way a second implementation — one on another platform, written by somebody else — would, which
# is the only check that the format is really a format. The versions are the ones the crate pins, so
# nothing new is compiled.
[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
