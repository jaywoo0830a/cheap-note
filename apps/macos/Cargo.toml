[package]
name = "cheap-note-macos"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "cheap-note on macOS: the platform half of the view, and nothing else."
license = "MIT OR Apache-2.0"
publish = false

# The package name is not `cheap-note`, and the binary name is: Cargo refuses two packages of one name
# in a workspace, and both apps are one program as far as a person is concerned.
[[bin]]
name = "cheap-note"
path = "src/main.rs"

# The platform half of the view: every module here implements a trait `note-ui` declared, and nothing in
# this crate is imported by anything above it.
[dependencies]
note-ui = { path = "../../crates/note-ui" }
note-format = { path = "../../crates/note-format" }
gpui-kit = "=0.9.0"

# The pen: `NSEvent`'s tablet fields, read on the thread that draws (see its own docs).
pen-macos = { path = "pen-macos" }

# The handle the pen is attached with.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# The system pointer, and the view the ink is drawn in.
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSCursor", "NSColor", "NSEvent", "NSImage", "NSView", "NSWindow", "block2"] }
objc2 = "0.6.5"
# The local monitor that answers AppKit's cursor updates while the ghost is up (see `platform/pointer.rs`).
block2 = "0.6"
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CATransaction", "CAMetalLayer"] }
objc2-core-foundation = "0.3"
# The canvas's own surface: one texture, one quad, one drawable per present.
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLSampler",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLResource",
    "MTLDrawable",
    "MTLTypes",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSProcessInfo", "NSString"] }
foreign-types-shared = "0.3"
# The canvas itself: geometry on the GPU, drawn by `metal.rs`; Core Graphics also posts the
# system pointer's events while the gamepad is driving it (see `platform/mouse.rs`).
core-graphics = { version = "0.24", features = ["highsierra"] }
# The dictionary `AXIsProcessTrustedWithOptions` takes, to ask for Accessibility once.
core-foundation = "0.10"
