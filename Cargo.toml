[workspace]
# Three crates, and each boundary is a question the compiler can ask:
#
#   note-format   what a note *is* on disk — no window, no pen, no GPU, no PDF renderer;
#   note-ui       what the app looks like and does — GPUI, and a seam where a platform goes;
#   the app       one per platform, and nothing but the platform: the canvas, the pen, the ghost
#                 cursor, the pointer hook, Pdfium's own entry points, and `main`.
#
# The point of the middle one is the next platform: everything above the seam is written once, and
# everything below it is what a macOS build would rewrite.
members = ["crates/note-format", "crates/note-ui", "apps/windows"]
resolver = "2"

# The apps' and the crates' own dependencies live in their manifests. What is left here is what
# Cargo insists a workspace root holds: the profiles.

# Keep debug builds usable: the UI stack is compiled with optimizations while the
# application's own crates stay fast to rebuild and debuggable.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# The writing loop is latency-sensitive, so the release build favours a fast binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
