[package]
name = "cheap-note-engine-metal"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "The macOS half of the cheap-note engine: a CAMetalLayer under GPUI's view, and the two passes an ink layer needs."
license = "MIT OR Apache-2.0"
publish = false

# `doc/ENGINE.md` §2.1: the engine is written twice behind one seam, because `wgpu` cannot be a peer of
# GPUI in this window — the canvas is a second DirectComposition target on Windows and a `CAMetalLayer`
# of the app's own on the Mac. This is the Mac half: it is a *cursor* over what `cheap-note-engine`
# computes, and it owns every call that talks to the GPU.
#
# What is portable and tested lives in `cheap-note-engine`; what is here is the Metal-shaped half of it,
# and the parts of it that are arithmetic (the draw list, the layout of the target, the stencil pass as
# a list of commands) are written so they can be tested with no device at all — `Gpu` is the one trait
# a test substitutes.
[dependencies]
cheap-note-engine = { path = "../engine" }
note-format = { path = "../note-format" }

# The device, the layer, and the present. The same crates and the same versions `apps/macos` already
# draws its canvas with (`apps/macos/Cargo.toml`), so the app can move onto this half without adding a
# second Metal binding to its graph.
objc2 = "0.6.5"
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLDrawable",
] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer"] }
objc2-foundation = { version = "0.3" }

[dev-dependencies]
cheap-note-engine = { path = "../engine", features = ["testing"] }
